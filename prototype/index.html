<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>BCD Express – Prototype Interactif & Enquête</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f1f4fb;--card:#fff;--p:#2f5be7;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0}
body.night{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--bd:#334155}
body.pastel{--bg:#faf6ee;--card:#fffdfa;--p:#e06c53;--ok:#2d9d68;--warn:#e69138;--bad:#d33838;--tx:#2c241b;--mut:#786c5e;--bd:#e6dbcd}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);transition:background .15s,color .15s}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;flex-wrap:wrap;gap:12px}
h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--p)}.btn.pri{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
.btn.big{padding:11px 22px;font-size:15px}.btn.danger{color:var(--bad)}
.pills{display:flex;gap:10px;padding:0 24px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px}.pill b{font-size:15px;color:var(--p)}
.tools{display:flex;gap:10px;padding:14px 24px;align-items:center;flex-wrap:wrap}
.tools input,.tools select{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px;font-family:inherit}
.tools input{flex:1;min-width:220px}
main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:0 24px 24px;align-items:start}
.main-single{display:block;padding:0 24px 24px}
.list{display:flex;flex-direction:column;gap:10px}
.mal{background:var(--card);border:2px solid transparent;border-left:6px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 3px #0001;transition:.15s}
.mal:hover{transform:translateY(-1px);box-shadow:0 3px 6px #0002}
.mal.sel{border-color:var(--p);border-left-color:var(--c)}
.mal .t{font-weight:700}.mal .m{color:var(--mut);font-size:12px;margin:2px 0 8px}
.mal .r{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
.b-ok{background:#dcfce7;color:#166534}.b-loan{background:#fef3c7;color:#92400e}.b-late{background:#fee2e2;color:#991b1b}
.detail{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 3px #0001;min-height:520px}
.dh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.dh h2{margin:0}.code{font-family:monospace;background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:6px;font-size:12px}
.tags{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tag{font-size:12px;padding:3px 10px;border-radius:8px;background:#e0f2fe;color:#075985}
.acts{display:flex;gap:8px;position:relative}
.menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--bd);border-radius:10px;display:none;z-index:5;min-width:170px;box-shadow:0 8px 24px #0002}
.menu.on{display:block}.menu div{padding:10px 14px;cursor:pointer;font-size:14px}.menu div:hover{background:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:12px 0 16px}
.tab{padding:9px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-size:14px;font-weight:600;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--p);border-color:var(--p);font-weight:700}
.alert{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{position:relative;border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
.book:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:0 4px 10px #0002}
.cover{height:130px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;margin-bottom:8px;box-shadow:inset 0 0 0 1px #fff3}
.book .bt{font-size:13px;font-weight:600;line-height:1.2;margin-bottom:3px}.book .ba{font-size:11px;color:var(--mut)}
.qty{position:absolute;top:6px;right:6px;background:var(--p);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px}
.rm{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;border:0;border-radius:8px;font-size:11px;padding:3px 8px;cursor:pointer;display:none}
.book:hover .rm{display:block}
.add{display:flex;gap:8px;margin-bottom:14px}.add input{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.drawer{position:fixed;right:-390px;top:0;bottom:0;width:370px;background:var(--card);box-shadow:-8px 0 30px #0003;padding:24px;transition:.25s;z-index:30;overflow:auto}
.drawer.on{right:0}.drawer .cover{height:180px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.empty{color:var(--mut);text-align:center;padding:30px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}.modal .box{background:var(--card);border-radius:16px;padding:24px;width:400px;max-width:90vw}
.modal select,.modal input,.modal textarea{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-family:inherit}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px #0004;z-index:99;display:none}
.toast.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>

<header>
  <div>
    <h1 id="app-title">🧰 BCD Express – Mallettes &amp; Gestion</h1>
    <div class="sub" id="app-sub">Créez des malles thématiques et prêtez-les en un clic aux classes</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" style="background:#fef3c7;border-color:#fde68a;color:#92400e;font-weight:700" onclick="openFeedback()">💬 Donner mon avis</button>
    <button class="btn" onclick="toggleStyle()" id="btn-style">🎨 Style : Apple</button>
    <button class="btn" onclick="document.body.classList.toggle('night')">🌙 Mode nuit</button>
    <button class="btn pri" id="btn-primary-action" onclick="newMal()">+ Nouvelle mallette</button>
  </div>
</header>

<!-- NAVIGATION PRINCIPALE PAR ONGLETS -->
<div class="tabs" style="padding:0 24px;margin:0 0 14px">
  <div class="tab on" id="nav-mal" onclick="switchNav('mal')">🧰 Mallettes</div>
  <div class="tab" id="nav-prets" onclick="switchNav('prets')">📖 Prêts &amp; Retours</div>
  <div class="tab" id="nav-livres" onclick="switchNav('livres')">📚 Catalogue Livres</div>
  <div class="tab" id="nav-etiquettes" onclick="switchNav('etiquettes')">🏷️ Étiquettes</div>
  <div class="tab" id="nav-bilan" onclick="switchNav('bilan')">📊 Bilan &amp; Palmarès</div>
</div>

<div class="pills" id="pills"></div>
<div class="tools" id="tools"></div>

<!-- CONTENEUR DU MODULE ACTIF -->
<div id="content-container"></div>

<!-- TIROIR LATÉRAL INSPECTEUR -->
<div class="drawer" id="drawer"></div>

<!-- MODALE DE PRÊT / FORMULAIRE -->
<div class="modal" id="modal">
  <div class="box">
    <h3 id="mt">Prêter</h3>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast">✅ Action validée</div>

<script>
const col=['#ef4444','#3b82f6','#10b981','#a855f7','#f59e0b','#06b6d4'];

// ── 1. Données Mallettes (Code exact fourni) ──────────────────────────
let M=[
{id:'MAL-004',t:'Harcèlement',th:'Harcèlement & Vivre ensemble',n:'Tous niveaux',loan:null,hist:[],
 b:[{t:'Le harcèlement',a:'Sandra Laboucarie',g:'Documentaire',q:3,e:'📕'},
    {t:'Le jour où je suis devenue invisible',a:'Amélie Javaux',g:'Album',q:3,e:'📗'},
    {t:'Lili est harcelée à l’école',a:'Dominique de Saint Mars',g:'Roman',q:4,e:'📘'},
    {t:'Max se fait insulter à la récré',a:'Serge Bloch',g:'BD',q:3,e:'💬'},
    {t:'Rouge',a:'Jan De Kinder',g:'Album',q:4,e:'🔴'}]},
{id:'MAL-003',t:'EDD',th:'EDD',n:'Tous niveaux',loan:null,hist:[],
 b:[{t:'La planète en danger',a:'Collectif',g:'Documentaire',q:4,e:'🌍'},
    {t:'Trier ses déchets',a:'Collectif',g:'Album',q:4,e:'♻️'}]},
{id:'MAL-002',t:'Laïcité',th:'Laïcité',n:'Tous niveaux',loan:null,hist:[],
 b:[{t:'La laïcité expliquée',a:'Collectif',g:'Documentaire',q:3,e:'⚖️'}]},
{id:'MAL-001',t:'Différence',th:'Différence',n:'Tous niveaux',loan:{c:'CE2 – Mme Petit',d:'2026-12-05'},hist:[{c:'CM1 – M. Roux',o:'2026-09-10',r:'2026-09-24'}],
 b:[{t:'La différence, c’est quoi ?',a:'Collectif',g:'Album',q:5,e:'🌈'},
    {t:'Les couleurs de l’amitié',a:'Collectif',g:'Album',q:6,e:'🎨'}]}
];
M.forEach((m,i)=>m.c=col[i%6]);

// ── 2. Données Prêts & Retours ───────────────────────────────────────
let L=[
  {id:101,u:'Léopold DUPONT',c:'CM2 – M. Durand',b:'Lili est harcelée à l’école',ex:2108,o:'2026-11-10',l:'2026-11-24',r:false},
  {id:102,u:'Camille MARTIN',c:'CE1 – M. Durand',b:'Le Petit Prince',ex:1042,o:'2026-11-03',l:'2026-11-17',r:false},
  {id:103,u:'Lucas BERNARD',c:'CM1 – M. Roux',b:'Les enfants de la Résistance',ex:3012,o:'2026-10-20',l:'2026-11-03',r:true},
  {id:104,u:'Inès LEFEBVRE',c:'CP – Mme Martin',b:'Rouge',ex:4102,o:'2026-11-12',l:'2026-11-26',r:false}
];

// ── 3. Données Catalogue Livres ──────────────────────────────────────
let B=[
  {t:'Le Petit Prince',a:'Antoine de Saint-Exupéry',g:'Roman',q:4,d:3,e:'⭐',c:col[1],desc:'Le chef-d’œuvre universel sur l’amitié et le regard d’enfant.'},
  {t:'Lili est harcelée à l’école',a:'Dominique de Saint Mars',g:'Roman',q:4,d:0,e:'📘',c:col[0],desc:'Pour libérer la parole sur le harcèlement scolaire.'},
  {t:'Les enfants de la Résistance (T.1)',a:'Vincent Dugomier',g:'BD',q:3,d:2,e:'🎖️',c:col[2],desc:'Trois enfants refusent de baisser les bras sous l’Occupation.'},
  {t:'Rouge',a:'Jan De Kinder',g:'Album',q:4,d:1,e:'🔴',c:col[4],desc:'Un livre sur le courage de dire non aux moqueries.'},
  {t:'La planète en danger',a:'Collectif',g:'Documentaire',q:4,d:4,e:'🌍',c:col[5],desc:'Comprendre le réchauffement climatique et la biodiversité.'},
  {t:'Max se fait insulter à la récré',a:'Serge Bloch',g:'BD',q:3,d:3,e:'💬',c:col[3],desc:'Comprendre les mots blessants et trouver des solutions.'}
];

let sel='MAL-004',tab='Contenu',pending=null,currentNav='mal';
const $=id=>document.getElementById(id), cnt=m=>m.b.reduce((s,x)=>s+x.q,0);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)}

// ── Navigation ────────────────────────────────────────────────────────
function switchNav(nav){
  currentNav=nav;
  ['mal','prets','livres','etiquettes','bilan'].forEach(k=>{
    $('nav-'+k).classList.toggle('on',k==nav);
  });
  if(nav=='mal'){
    $('app-title').innerHTML='🧰 BCD Express – Mallettes pédagogiques';
    $('app-sub').innerHTML='Créez des malles thématiques et prêtez-les en un clic aux classes';
    $('btn-primary-action').style.display='inline-block';
    $('btn-primary-action').textContent='+ Nouvelle mallette';
    $('btn-primary-action').onclick=newMal;
    render();
  } else if(nav=='prets'){
    $('app-title').innerHTML='📖 Prêts &amp; Retours en classe';
    $('app-sub').innerHTML='Enregistrez les sorties, retours et gérez les retards scolaires';
    $('btn-primary-action').style.display='inline-block';
    $('btn-primary-action').textContent='+ Nouveau prêt élève';
    $('btn-primary-action').onclick=openPretModal;
    renderPrets();
  } else if(nav=='livres'){
    $('app-title').innerHTML='📚 Catalogue &amp; Inventaire BCD';
    $('app-sub').innerHTML='1 420 titres répertoriés · 2 850 exemplaires physiques';
    $('btn-primary-action').style.display='inline-block';
    $('btn-primary-action').textContent='+ Nouveau livre';
    $('btn-primary-action').onclick=()=>alert('Fiche création livre ouverte !');
    renderLivres();
  } else if(nav=='etiquettes'){
    $('app-title').innerHTML='🏷️ Planche d’étiquettes Code 39';
    $('app-sub').innerHTML='Impression prête à l’emploi sur papier autocollant A4 standard';
    $('btn-primary-action').style.display='inline-block';
    $('btn-primary-action').textContent='🖨️ Imprimer la planche';
    $('btn-primary-action').onclick=()=>window.print();
    renderEtiquettes();
  } else if(nav=='bilan'){
    $('app-title').innerHTML='📊 Bilan d’activité &amp; Palmarès BCD';
    $('app-sub').innerHTML='Statistiques de lecture pour le Conseil d’école et la Direction';
    $('btn-primary-action').style.display='none';
    renderBilan();
  }
}

// ── MODULE 1 : MALLETTES (100% Exact Code du user) ────────────────────
function pills(){const l=M.filter(m=>m.loan).length;$('pills').innerHTML=
`<span class="pill"><b>${M.length}</b> mallettes</span><span class="pill"><b>${M.length-l}</b> disponibles</span><span class="pill"><b>${l}</b> en prêt</span><span class="pill"><b>${M.reduce((s,m)=>s+cnt(m),0)}</b> livres</span>`}

function renderList(){const q=($('q')?$('q').value:'').toLowerCase(),f=($('fs')?$('fs').value:'');
$('list').innerHTML=M.filter(m=>(m.t+m.th+m.id).toLowerCase().includes(q)&&(!f||(f=='En prêt')==!!m.loan)).map(m=>
`<div class="mal ${m.id==sel?'sel':''}" style="--c:${m.c}" onclick="sel='${m.id}';tab='Contenu';render()">
<div class="t">${m.t}</div><div class="m">${m.id} · ${m.n} · ${cnt(m)} livres · ${m.b.length} titres</div>
<div class="r"><span class="badge ${m.loan?'b-loan':'b-ok'}">${m.loan?'En prêt – '+m.loan.c:'Disponible'}</span>
${m.loan?'':`<button class="btn pri" onclick="event.stopPropagation();openLoan('${m.id}')">Prêter</button>`}</div></div>`).join('')}

function renderDetail(){
const m=M.find(x=>x.id==sel);if(!m){$('detail').innerHTML='';return}
let body='';
if(tab=='Contenu'){
body=`${m.loan?`<div class="alert">📦 Cette mallette est chez <b>${m.loan.c}</b> jusqu'au <b>${m.loan.d}</b>.</div>`:''}
<div class="add"><input id="nb" placeholder="Titre du livre à ajouter..."><button class="btn pri" onclick="addB()">+ Ajouter</button><button class="btn" onclick="fill()">🪄 Remplir par thème</button></div>
<div class="grid">${m.b.map((b,i)=>`<div class="book" onclick="openB(${i})">
<span class="qty">×${b.q}</span><button class="rm" onclick="event.stopPropagation();rmB(${i})">Retirer</button>
<div class="cover" style="background:${col[(i+2)%6]}">${b.e}</div><div class="bt">${b.t}</div><div class="ba">${b.a} · ${b.g}</div></div>`).join('')}</div>`}
else if(tab=='Ressources'){body='<div class="empty">📎 Aucune ressource pédagogique.<br><br><button class="btn" onclick="toast(\'Ajout ressource PDF / lien\')">+ Ajouter un PDF / lien</button></div>'}
else if(tab=='Historique'){const h=[...(m.loan?[{c:m.loan.c,o:'2026-11-17',r:'en cours'}]:[]),...m.hist];
body=h.length?`<table><tr><th>Classe</th><th>Sortie</th><th>Retour</th></tr>${h.map(x=>`<tr><td>${x.c}</td><td>${x.o}</td><td>${x.r}</td></tr>`).join('')}</table>`:'<div class="empty">Aucun prêt pour le moment</div>'}
else body=`<p><b>Thème :</b> ${m.th}</p><p><b>Niveau :</b> ${m.n}</p><p class="sub">Aucune note pédagogique particulière.</p>`;
$('detail').innerHTML=`<div class="dh"><div><h2>${m.t} <span class="code">${m.id}</span> <span class="badge ${m.loan?'b-loan':'b-ok'}">${m.loan?'En prêt':'Disponible'}</span></h2>
<div class="tags"><span class="tag">Thème : ${m.th}</span><span class="tag">${m.n}</span><span class="tag">${cnt(m)} exemplaires (${m.b.length} titres)</span></div></div>
<div class="acts">${m.loan?`<button class="btn pri big" onclick="ret('${m.id}')">↩ Enregistrer le retour</button>`:`<button class="btn pri big" onclick="openLoan('${m.id}')">📤 Prêter</button>`}
<button class="btn" onclick="$('mn').classList.toggle('on')">⋯</button>
<div class="menu" id="mn"><div onclick="alert('Fiche A4 générée')">🖨️ Fiche A4</div><div onclick="alert('Étiquette générée')">🏷️ Étiquette</div><div onclick="delM()" style="color:var(--bad)">🗑️ Supprimer</div></div></div></div>
<div class="tabs">${['Contenu','Ressources','Historique','Infos'].map(t=>`<div class="tab ${t==tab?'on':''}" onclick="tab='${t}';renderDetail()">${t}</div>`).join('')}</div>${body}`}

function openB(i){const m=M.find(x=>x.id==sel),b=m.b[i];$('drawer').innerHTML=`<button class="btn" onclick="$('drawer').classList.remove('on')">✕ Fermer</button>
<div class="cover" style="background:${col[(i+2)%6]};margin-top:14px">${b.e}</div><h3>${b.t}</h3><p class="sub">${b.a}</p>
<p><span class="tag">${b.g}</span> <span class="tag">${m.th}</span></p><p>📦 ${b.q} exemplaire(s) dans la boîte</p>
<div style="display:flex;gap:8px;align-items:center"><button class="btn" onclick="qty(${i},-1)">−</button><b>${b.q}</b><button class="btn" onclick="qty(${i},1)">+</button></div>
<br><button class="btn danger" onclick="rmB(${i});$('drawer').classList.remove('on')">Retirer ce titre</button>`;$('drawer').classList.add('on')}

function qty(i,d){const b=M.find(x=>x.id==sel).b[i];b.q=Math.max(1,b.q+d);render();openB(i)}
function rmB(i){if(confirm('Retirer ce titre de la mallette ?')){M.find(x=>x.id==sel).b.splice(i,1);render()}}
function addB(){const v=$('nb').value.trim();if(!v)return;M.find(x=>x.id==sel).b.push({t:v,a:'À compléter',g:'Livre',q:1,e:'📖'});render()}
function fill(){const m=M.find(x=>x.id==sel);m.b.push({t:'Livre du thème (auto)',a:'Catalogue BCD',g:'Album',q:2,e:'📚'});render()}

function openLoan(id){
  pending=id;const d=new Date();d.setDate(d.getDate()+21);
  $('mt').textContent='Prêter « '+M.find(x=>x.id==id).t+' »';
  $('modal-content').innerHTML=`<label>Classe</label><select id="cl"><option>CP – Mme Martin</option><option>CE1 – M. Durand</option><option>CE2 – Mme Petit</option><option>CM1 – M. Roux</option><option>CM2 – Mme Blanc</option></select>
  <label>Date de retour</label><input type="date" id="dr" value="${d.toISOString().slice(0,10)}">
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeM()">Annuler</button><button class="btn pri" onclick="confirmLoan()">Confirmer le prêt</button></div>`;
  $('modal').classList.add('on');
}
function closeM(){$('modal').classList.remove('on')}
function confirmLoan(){M.find(x=>x.id==pending).loan={c:$('cl').value,d:$('dr').value};closeM();render();toast('Mallette prêtée avec succès !')}
function ret(id){const m=M.find(x=>x.id==id);if(confirm('Tous les livres sont-ils rendus ?')){m.hist.unshift({c:m.loan.c,o:'—',r:new Date().toISOString().slice(0,10)});m.loan=null;render();toast('Mallette restituée !')}}
function delM(){if(confirm('Supprimer cette mallette ?')){M=M.filter(x=>x.id!=sel);sel=M[0]?.id;render()}}
function newMal(){const t=prompt('Titre de la mallette ?');if(!t)return;const id='MAL-00'+(M.length+5);M.unshift({id,t,th:t,n:'Tous niveaux',loan:null,hist:[],b:[],c:col[M.length%6]});sel=id;render()}

function render(){
  $('tools').innerHTML=`<input id="q" placeholder="🔍 Rechercher par titre, thème, code…" oninput="renderList()">
  <select id="fs" onchange="renderList()"><option value="">Tous les statuts</option><option>Disponible</option><option>En prêt</option></select>`;
  $('content-container').innerHTML=`<main><div class="list" id="list"></div><section class="detail" id="detail"></section></main>`;
  pills();renderList();renderDetail();
}

// ── MODULE 2 : PRÊTS & RETOURS ────────────────────────────────────────
function renderPrets(){
  $('pills').innerHTML=`<span class="pill"><b>${L.length}</b> emprunts en cours</span><span class="pill"><b>${L.filter(x=>x.r).length}</b> en retard</span><span class="pill"><b>18</b> prêts aujourd'hui</span><span class="pill"><b>99.1%</b> taux de retour</span>`;
  $('tools').innerHTML=`<input id="qp" placeholder="🔍 Rechercher un élève, un livre ou une classe..." oninput="renderPretsList()">
  <select id="fcl" onchange="renderPretsList()"><option value="">Toutes les classes</option><option>CP</option><option>CE1</option><option>CE2</option><option>CM1</option><option>CM2</option></select>
  <button class="btn pri" onclick="openPretModal()">+ Nouveau prêt (Boucle continue)</button>`;
  $('content-container').innerHTML=`<div class="main-single"><div class="detail"><table id="table-prets"></table></div></div>`;
  renderPretsList();
}

function renderPretsList(){
  const q=($('qp')?$('qp').value:'').toLowerCase(),cl=($('fcl')?$('fcl').value:'');
  const filtered=L.filter(x=>(x.u+x.b+x.c).toLowerCase().includes(q)&&(!cl||x.c.includes(cl)));
  $('table-prets').innerHTML=`<tr><th>Élève</th><th>Classe</th><th>Livre</th><th>N° Ex.</th><th>Sortie</th><th>Limite</th><th>Statut</th><th>Action</th></tr>`+
  filtered.map((x,i)=>`<tr><td><b>${x.u}</b></td><td>${x.c}</td><td>📖 ${x.b}</td><td><code>#${x.ex}</code></td><td>${x.o}</td><td>${x.l}</td>
  <td><span class="badge ${x.r?'b-late':'b-ok'}">${x.r?'En retard':'En cours'}</span></td>
  <td><button class="btn" onclick="retourPret(${x.id})">↩ Restituer</button></td></tr>`).join('');
}

function retourPret(id){
  L=L.filter(x=>x.id!==id);
  renderPrets();
  toast('Livre restitué avec succès ! Bip audio émis.');
}

function openPretModal(){
  $('mt').textContent='Nouveau prêt élève';
  $('modal-content').innerHTML=`<label>Élève</label><select id="n-elv"><option>Lucas BERNARD (CM2 – M. Durand)</option><option>Léopold DUPONT (CM2 – M. Durand)</option><option>Camille MARTIN (CE1 – M. Durand)</option><option>Inès LEFEBVRE (CP – Mme Martin)</option></select>
  <label>Livre (Titre ou scan)</label><input id="n-liv" value="Le Petit Prince (#1042)">
  <div style="background:#eff6ff;color:#1e40af;padding:10px;border-radius:10px;font-size:12px;margin:8px 0 14px">⚡ <b>Boucle continue active :</b> enregistre le prêt et passe directement au lecteur suivant sans fermer la fenêtre.</div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeM()">Fermer</button><button class="btn pri" onclick="validerPretSuivant()">⚡ Valider &amp; Élève suivant ➔</button></div>`;
  $('modal').classList.add('on');
}

function validerPretSuivant(){
  const elv=$('n-elv').value.split(' (')[0], liv=$('n-liv').value.split(' (#')[0];
  L.unshift({id:Date.now(),u:elv,c:'CM2 – M. Durand',b:liv,ex:Math.floor(1000+Math.random()*9000),o:'2026-11-17',l:'2026-12-08',r:false});
  renderPrets();
  toast('Prêt validé pour '+elv+' ! Élève suivant.');
  $('n-liv').value='';$('n-liv').focus();
}

// ── MODULE 3 : CATALOGUE LIVRES ───────────────────────────────────────
function renderLivres(){
  $('pills').innerHTML=`<span class="pill"><b>1 420</b> titres</span><span class="pill"><b>2 850</b> exemplaires</span><span class="pill"><b>124</b> en mallettes</span><span class="pill"><b>6</b> à réparer</span>`;
  $('tools').innerHTML=`<input id="ql" placeholder="🔍 Rechercher un livre par titre, auteur, genre..." oninput="renderLivresGrid()">
  <select id="fg" onchange="renderLivresGrid()"><option value="">Tous les genres</option><option>Roman</option><option>Album</option><option>BD</option><option>Documentaire</option></select>`;
  $('content-container').innerHTML=`<div class="main-single"><div class="grid" id="grid-livres"></div></div>`;
  renderLivresGrid();
}

function renderLivresGrid(){
  const q=($('ql')?$('ql').value:'').toLowerCase(),g=($('fg')?$('fg').value:'');
  const filtered=B.filter(x=>(x.t+x.a).toLowerCase().includes(q)&&(!g||x.g==g));
  $('grid-livres').innerHTML=filtered.map((b,i)=>`<div class="book" onclick="openBookDrawer(${i})">
  <span class="qty">${b.q} ex.</span>
  <div class="cover" style="background:${b.c}">${b.e}</div>
  <div class="bt">${b.t}</div>
  <div class="ba">${b.a} · ${b.g}</div>
  <div style="margin-top:6px"><span class="badge ${b.d>0?'b-ok':'b-loan'}">${b.d>0?b.d+' dispo':'Prêté'}</span></div>
  </div>`).join('');
}

function openBookDrawer(i){
  const b=B[i];
  $('drawer').innerHTML=`<button class="btn" onclick="$('drawer').classList.remove('on')">✕ Fermer</button>
  <div class="cover" style="background:${b.c};margin-top:14px">${b.e}</div>
  <h3>${b.t}</h3><p class="sub">${b.a}</p>
  <p><span class="tag">${b.g}</span> <span class="tag">${b.d} disponible(s) / ${b.q} total</span></p>
  <p style="font-size:13px;line-height:1.5">${b.desc}</p>
  <div style="background:var(--bg);padding:10px;border-radius:10px;margin-bottom:14px;font-size:12px">
    <div>• Exemplaire #1042 — <b>Rayon A (Disponible)</b></div>
    <div>• Exemplaire #1043 — <b>Rayon A (Disponible)</b></div>
  </div>
  <button class="btn pri" style="width:100%" onclick="toast('Prêt direct lancé pour ce livre !');$('drawer').classList.remove('on')">📖 Prêter cet ouvrage</button>`;
  $('drawer').classList.add('on');
}

// ── COMMUTATEUR DE STYLES COMPARATIFS ─────────────────────────────────
function toggleStyle(){
  if(document.body.classList.contains('pastel')){
    document.body.classList.remove('pastel');
    $('btn-style').textContent='🎨 Style : Apple';
    toast('Style : Apple Cupertino activé');
  } else {
    document.body.classList.add('pastel');
    $('btn-style').textContent='🎨 Style : Pastel';
    toast('Style : Pastel Chaleureux activé');
  }
}

// ── ENQUÊTE ENSEIGNANTS MODAL ─────────────────────────────────────────
function openFeedback(){
  $('mt').textContent='💬 Enquête Enseignants BCD Express';
  $('modal-content').innerHTML=`<label>Votre Nom &amp; Classe :</label><input id="f-nom" placeholder="ex: Mme Martin (CP)">
  <label>Style visuel préféré :</label><select id="f-st"><option>Apple Cupertino (Sobre, épuré, bleu)</option><option>Pastel Chaleureux (Couleurs douces école)</option></select>
  <label>Note globale sur l'interface :</label><select id="f-sc"><option>⭐⭐⭐⭐⭐ Excellent (5/5)</option><option>⭐⭐⭐⭐ Très bien (4/5)</option><option>⭐⭐⭐ Moyen (3/5)</option></select>
  <label>Vos remarques &amp; suggestions :</label><textarea id="f-rm" rows="3" placeholder="Ce qui vous plaît ou ce qu'il faudrait modifier..."></textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeM()">Fermer</button><button class="btn pri" onclick="saveFeedback()">💾 Enregistrer mon avis</button></div>`;
  $('modal').classList.add('on');
}

function saveFeedback(){
  const txt=`AVIS BCD EXPRESS\nEnseignant : ${$('f-nom').value||'Enseignant'}\nStyle : ${$('f-st').value}\nNote : ${$('f-sc').value}\nRemarques : ${$('f-rm').value||'Aucune'}`;
  if(navigator.clipboard){navigator.clipboard.writeText(txt);}
  closeM();
  toast('Merci ! Votre avis a été copié dans le presse-papier.');
}

render();
