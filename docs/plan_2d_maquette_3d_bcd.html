      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {

    }

    }

    .svg-item.dimmed {

    }
    .label-3d {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    .label-3d:hover {
      transform: translate(-50%, -50%) scale(1.15);
      z-index: 30;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;

    // =========================================================================
    // 4. SÉLECTION & RECHERCHE
    // =========================================================================
    function selectItem(id) {
      selectedId = id;
      updateVisualStates();
      renderSidebar();
    }

    function updateVisualStates() {
      // Mise à jour 2D
      document.querySelectorAll('.svg-item').forEach(el => {
        const id = el.getAttribute('data-id');
        el.classList.toggle('selected', id === selectedId);
        const hasSearch = searchQuery.length > 0;
        const isMatch = matchedIds.has(id);
        el.classList.toggle('highlighted', hasSearch && isMatch);
        el.classList.toggle('dimmed', hasSearch && !isMatch && id !== selectedId);
      });

      // Mise à jour 3D
      if (threeInitialized) {
        Object.entries(furnitureMeshes).forEach(([id, group]) => {
          const isSelected = id === selectedId;
          const isMatch = searchQuery.length > 0 && matchedIds.has(id);
          group.traverse(child => {
            if (child.isMesh && child.material && child.material.emissive) {
              if (isSelected) {
                child.material.emissive.setHex(0x1d4ed8);
                child.material.emissiveIntensity = 0.28;
              } else if (isMatch) {
                child.material.emissive.setHex(0xf59e0b);
                child.material.emissiveIntensity = 0.32;
              } else {
                child.material.emissive.setHex(0x000000);
                child.material.emissiveIntensity = 0;
              }
            }
          });
        });

        // Mise à jour des étiquettes 3D
        Object.entries(labelElements3D).forEach(([id, el]) => {
          const isSelected = id === selectedId;
          const isMatch = searchQuery.length > 0 && matchedIds.has(id);
          if (isSelected) {
            el.className = 'label-3d w-7 h-7 rounded-full bg-blue-600 text-white border-2 border-white shadow-md text-xs font-bold flex items-center justify-center z-20';
          } else if (isMatch) {
            el.className = 'label-3d w-7 h-7 rounded-full bg-amber-400 text-slate-900 border-2 border-white shadow-md text-xs font-bold flex items-center justify-center z-20';
          } else {
            el.className = 'label-3d w-6 h-6 rounded-full bg-white/95 text-slate-800 border border-slate-300 shadow text-[11px] font-bold flex items-center justify-center z-10';
          }
        });
      }
    }

    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    const searchBanner = document.getElementById('search-banner');
    const searchBannerText = document.getElementById('search-banner-text');

    function handleSearch() {
      searchQuery = searchInput.value.trim().toLowerCase();
      searchClear.classList.toggle('hidden', !searchQuery);
      matchedIds.clear();

      if (searchQuery) {
        ITEMS.forEach(item => {
          const haystack = `${item.name} ${item.keywords} ${item.faces.map(f => f.content).join(' ')}`.toLowerCase();
          if (haystack.includes(searchQuery)) {
            matchedIds.add(item.id);
          }
        });

        searchBanner.classList.remove('hidden');
        if (matchedIds.size === 0) {
          searchBannerText.textContent = `Aucun rayon trouvé pour « ${searchInput.value} »`;
        } else {
          const nums = ITEMS.filter(i => matchedIds.has(i.id) && i.num !== null).map(i => `n°${i.num}`);
          searchBannerText.textContent = `${matchedIds.size} résultat(s) surligné(s) ${nums.length ? '(' + nums.join(', ') + ')' : ''}`;
        }
      } else {
        searchBanner.classList.add('hidden');
      }

      updateVisualStates();
      if (!selectedId) renderSidebar();
    }

    searchInput.addEventListener('input', handleSearch);
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      handleSearch();
      searchInput.focus();
    });

    // =========================================================================
    // 5. MOTEUR 3D INTERACTIF (THREE.JS)
    // =========================================================================
    let threeInitialized = false;
    let scene, camera, renderer, raycaster, mouse;
    const furnitureMeshes = {};
    const clickableObjects = [];
    const labelElements3D = {};

    // Paramètres de la caméra orbitale maison (fluide souris + tactile)
    const orbit = {
      target: new THREE.Vector3(ROOM_W / 2, 0.5, ROOM_D / 2),
      radius: 11.5,
      theta: Math.PI * 0.28, // angle horizontal
      phi: Math.PI * 0.32,   // angle vertical
      isDragging: false,
      isPanning: false,
      prevX: 0,
      prevY: 0,
      moved: false
    };

    function updateCameraFromOrbit() {
      const sinPhi = Math.sin(orbit.phi);
      camera.position.x = orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta);
      camera.position.y = orbit.target.y + orbit.radius * Math.cos(orbit.phi);
      camera.position.z = orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta);
      camera.lookAt(orbit.target);
    }

    function setCameraPreset(preset) {
      orbit.target.set(ROOM_W / 2, 0.4, ROOM_D / 2);
      if (preset === 'iso') {
        orbit.radius = 11.2;
        orbit.theta = Math.PI * 0.25;
        orbit.phi = Math.PI * 0.30;
      } else if (preset === 'top') {
        orbit.radius = 11.8;
        orbit.theta = 0.001;
        orbit.phi = 0.04;
      } else {
        // Réinitialiser
        orbit.radius = 11.5;
        orbit.theta = Math.PI * 0.28;
        orbit.phi = Math.PI * 0.32;
      }
      updateCameraFromOrbit();
    }

    // Petit générateur pseudo-aléatoire déterministe pour les couleurs de livres
    let seed = 42;
    function rand() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    const BOOK_COLORS = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x06b6d4, 0xf97316, 0x6366f1];

    function buildBooksRow(group, xStart, xEnd, y, z, depth, isAlongX) {
      const length = isAlongX ? (xEnd - xStart) : (z - xStart);
      let cursor = 0.05;
      while (cursor < length - 0.08) {
        const thickness = 0.03 + rand() * 0.035;
        const bh = 0.16 + rand() * 0.11;
        const bd = Math.min(depth * 0.8, 0.16 + rand() * 0.05);
        const col = BOOK_COLORS[Math.floor(rand() * BOOK_COLORS.length)];
        const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 });
        const geo = isAlongX
          ? new THREE.BoxGeometry(thickness, bh, bd)
          : new THREE.BoxGeometry(bd, bh, thickness);
        const book = new THREE.Mesh(geo, mat);
        if (isAlongX) {
          book.position.set(xStart + cursor + thickness / 2, y + bh / 2, z);
        } else {
          book.position.set(xEnd, y + bh / 2, xStart + cursor + thickness / 2);
        }
        book.castShadow = true;
        group.add(book);
        cursor += thickness + 0.008;
      }
    }

    function createFurniture3D(item) {
      const group = new THREE.Group();
      const w = item.x2 - item.x1;
      const d = item.z2 - item.z1;
      const h = item.height;
      const cx = item.x1 + w / 2;
      const cz = item.z1 + d / 2;

      const matYellow = () => new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.45 });
      const matGreen  = () => new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.45 });
      const matGrey   = () => new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.6 });
      const matWhite  = () => new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.55 });
      const matWood   = () => new THREE.MeshStandardMaterial({ color: 0xd99b52, roughness: 0.7 });

      if (item.category === 'shelf') {
        const isGreen = item.style3d === 'shelf-green';
        const frameMat = isGreen ? matGreen() : matYellow();
        const shelfMat = isGreen ? matWhite() : matGrey();

        // Montants verticaux aux extrémités
        const postGeo = new THREE.BoxGeometry(0.06, h, 0.06);
        const positions = [
          [item.x1 + 0.04, item.z1 + 0.04],
          [item.x2 - 0.04, item.z1 + 0.04],
          [item.x1 + 0.04, item.z2 - 0.04],
          [item.x2 - 0.04, item.z2 - 0.04]
        ];
        positions.forEach(([px, pz]) => {
          const post = new THREE.Mesh(postGeo, frameMat.clone());
          post.position.set(px, h / 2, pz);
          post.castShadow = true;
          group.add(post);
        });

        // Tablettes (4 niveaux) + livres stylisés
        const levels = 4;
        const isAlongX = w >= d;
        for (let i = 0; i < levels; i++) {
          const sy = 0.18 + i * ((h - 0.35) / (levels - 1));
          const slab = new THREE.Mesh(new THREE.BoxGeometry(w - 0.04, 0.035, d - 0.04), shelfMat.clone());
          slab.position.set(cx, sy, cz);
          slab.castShadow = true;
          slab.receiveShadow = true;
          group.add(slab);

          // Livres sur chaque tablette
          if (isAlongX) {
            buildBooksRow(group, item.x1 + 0.06, item.x2 - 0.06, sy + 0.02, cz, d, true);
          } else {
            buildBooksRow(group, item.z1 + 0.06, cx, sy + 0.02, item.z2 - 0.06, w, false);
          }
        }
      } else if (item.category === 'bin') {
        if (item.style3d === 'bin-bd-tiered') {
          // Grand bac BD à 2 niveaux en escalier
          const base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.45, d), matWhite());
          base.position.set(cx, 0.45, cz);
          base.castShadow = true;
          group.add(base);

          const topTier = new THREE.Mesh(new THREE.BoxGeometry(w * 0.55, 0.35, d * 0.92), matGrey());
          topTier.position.set(cx, 0.85, cz);
          topTier.castShadow = true;
          group.add(topTier);

          // Pieds jaunes
          const leg = new THREE.Mesh(new THREE.BoxGeometry(w * 0.9, 0.25, 0.07), matYellow());
          leg.position.set(cx, 0.125, item.z1 + 0.12);
          group.add(leg);
          const leg2 = leg.clone();
          leg2.position.z = item.z2 - 0.12;
          group.add(leg2);
        } else if (item.style3d === 'bin-wood-double') {
          // 2 bacs en bois sous le radiateur
          const b1 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.48, 0.32, d), matWood());
          b1.position.set(item.x1 + w * 0.24, 0.46, cz);
          b1.castShadow = true;
          group.add(b1);

          const b2 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.46, 0.4, d * 0.9), matWood());
          b2.position.set(item.x2 - w * 0.23, 0.2, cz);
          b2.castShadow = true;
          group.add(b2);
        } else {
          // Bacs sur pieds (vert, blanc, ou CP/CE1 gris)
          const boxMat = item.style3d === 'bin-green' ? matGreen() : (item.style3d === 'bin-cp-ce1' ? matGrey() : matWhite());
          const box = new THREE.Mesh(new THREE.BoxGeometry(w, 0.36, d), boxMat);
          box.position.set(cx, h - 0.18, cz);
          box.castShadow = true;
          group.add(box);

          const legMat = item.style3d === 'bin-green' ? matWhite() : matYellow();
          const legGeo = new THREE.BoxGeometry(0.05, h - 0.36, 0.05);
          [[item.x1 + 0.06, item.z1 + 0.06], [item.x2 - 0.06, item.z1 + 0.06], [item.x1 + 0.06, item.z2 - 0.06], [item.x2 - 0.06, item.z2 - 0.06]].forEach(([lx, lz]) => {
            const l = new THREE.Mesh(legGeo, legMat.clone());
            l.position.set(lx, (h - 0.36) / 2, lz);
            group.add(l);
          });
        }
      } else if (item.category === 'seating') {
        if (item.style3d === 'chairs-3') {
          const colors = [0x16a34a, 0x2563eb, 0x2563eb];
          for (let i = 0; i < 3; i++) {
            const chX = item.x1 + 0.25 + i * 0.45;
            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.38), new THREE.MeshStandardMaterial({ color: colors[i] }));
            seat.position.set(chX, 0.42, cz);
            seat.castShadow = true;
            group.add(seat);
            const back = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.36, 0.05), new THREE.MeshStandardMaterial({ color: colors[i] }));
            back.position.set(chX, 0.62, item.z1 + 0.08);
            group.add(back);
          }
        } else if (item.style3d === 'sofa-green') {
          const sofaMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 });
          const base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.38, d), sofaMat);
          base.position.set(cx, 0.19, cz);
          base.castShadow = true;
          group.add(base);
          const back = new THREE.Mesh(new THREE.BoxGeometry(w, 0.42, 0.16), sofaMat.clone());
          back.position.set(cx, 0.55, item.z1 + 0.08);
          group.add(back);
        } else if (item.style3d === 'poufs-green') {
          const poufMat = new THREE.MeshStandardMaterial({ color: 0x84cc16, roughness: 0.75 });
          const p1 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.47, 0.38, d), poufMat);
          p1.position.set(item.x1 + w * 0.24, 0.19, cz);
          p1.castShadow = true;
          group.add(p1);
          const p2 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.47, 0.38, d), poufMat.clone());
          p2.position.set(item.x2 - w * 0.24, 0.19, cz);
          p2.castShadow = true;
          group.add(p2);
        }
      } else if (item.category === 'desk') {
        const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), matGrey());
        top.position.set(cx, h, cz);
        top.castShadow = true;
        top.receiveShadow = true;
        group.add(top);

        const legGeo = new THREE.BoxGeometry(0.05, h, 0.05);
        [[item.x1 + 0.06, item.z1 + 0.06], [item.x2 - 0.06, item.z1 + 0.06], [item.x1 + 0.06, item.z2 - 0.06], [item.x2 - 0.06, item.z2 - 0.06]].forEach(([lx, lz]) => {
          const l = new THREE.Mesh(legGeo, matYellow());
          l.position.set(lx, h / 2, lz);
          group.add(l);
        });

        if (item.style3d === 'desk-pc') {
          // Écran d'ordinateur sur le bureau
          const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.52), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
          monitor.position.set(cx - 0.15, h + 0.22, cz);
          group.add(monitor);
        }
      }

      // Associer l'ID à tous les meshes enfants pour le raycasting
      group.traverse(child => {
        if (child.isMesh) {
          child.userData.itemId = item.id;
          clickableObjects.push(child);
        }
      });

      return group;
    }

    function initThree() {
      if (threeInitialized) return;
      threeInitialized = true;

      const container = document.getElementById('three-canvas-wrapper');
      const labelsLayer = document.getElementById('labels-3d-layer');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf1f5f9);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
      updateCameraFromOrbit();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Éclairage doux et réaliste
      const ambient = new THREE.AmbientLight(0xffffff, 0.68);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.72);
      dirLight.position.set(4, 11, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 1;
      dirLight.shadow.camera.far = 25;
      dirLight.shadow.camera.left = -8;
      dirLight.shadow.camera.right = 8;
      dirLight.shadow.camera.top = 8;
      dirLight.shadow.camera.bottom = -8;
      scene.add(dirLight);

      // Sol (moquette gris anthracite doux)
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(ROOM_W, ROOM_D),
        new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.92 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(ROOM_W / 2, 0, ROOM_D / 2);
      floor.receiveShadow = true;
      scene.add(floor);

      // Tapis bleu dans le coin lecture (bas-droite)
      const rug = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 1.7),
        new THREE.MeshStandardMaterial({ color: 0x7dd3fc, roughness: 0.9 })
      );
      rug.rotation.x = -Math.PI / 2;
      rug.position.set(7.3, 0.01, 6.45);
      rug.receiveShadow = true;
      scene.add(rug);

      // Murs (hauteur 2.6m, semi-bas sur l'avant pour bien voir)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.85 });
      const wallH = 2.5;

      // Mur du haut (Z=0) : muret + verrière jaune
      const topLower = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 1.1, 0.12), wallMat);
      topLower.position.set(ROOM_W / 2, 0.55, -0.06);
      scene.add(topLower);

      const glassMat = new THREE.MeshStandardMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.35, roughness: 0.1 });
      const verriere = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.1, 0.04), glassMat);
      verriere.position.set(5.4, 1.75, -0.06);
      scene.add(verriere);

      const frameY = new THREE.MeshStandardMaterial({ color: 0xeab308 });
      const barTop = new THREE.Mesh(new THREE.BoxGeometry(6.7, 0.08, 0.1), frameY);
      barTop.position.set(5.4, 2.3, -0.06);
      scene.add(barTop);
      const barBot = barTop.clone();
      barBot.position.y = 1.15;
      scene.add(barBot);

      // Porte d'entrée (X=1.0 à 2.0)
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.95, 2.1, 0.06), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
      door.position.set(1.05, 1.05, 0.45);
      door.rotation.y = Math.PI / 2;
      scene.add(door);

      // Mur de droite (X=9) : mur plein + affiches décoratives
      const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, wallH, ROOM_D), wallMat);
      rightWall.position.set(ROOM_W + 0.06, wallH / 2, ROOM_D / 2);
      rightWall.receiveShadow = true;
      scene.add(rightWall);

      // 3 affiches stylisées sur le mur droit
      const posterColors = [0x1e293b, 0xfacc15, 0xf43f5e];
      [1.8, 3.6, 5.4].forEach((pz, idx) => {
        const poster = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.75, 0.6), new THREE.MeshStandardMaterial({ color: posterColors[idx] }));
        poster.position.set(ROOM_W - 0.01, 1.95, pz);
        scene.add(poster);
      });

      // Mur de gauche (X=0) : muret bas pour ne pas gêner la vue
      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.0, ROOM_D), wallMat);
      leftWall.position.set(-0.06, 0.5, ROOM_D / 2);
      scene.add(leftWall);

      // Mur du bas (Z=7.5) : allège basse + fenêtres translucides
      const botLower = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W, 0.85, 0.12), wallMat);
      botLower.position.set(ROOM_W / 2, 0.425, ROOM_D + 0.06);
      scene.add(botLower);

      const botWindow = new THREE.Mesh(new THREE.BoxGeometry(ROOM_W - 0.6, 1.3, 0.04), glassMat);
      botWindow.position.set(ROOM_W / 2, 1.5, ROOM_D + 0.06);
      scene.add(botWindow);

      // Création de tous les meubles + étiquettes flottantes 1 à 11
      ITEMS.forEach(item => {
        const meshGroup = createFurniture3D(item);
        scene.add(meshGroup);
        furnitureMeshes[item.id] = meshGroup;

        if (item.num !== null) {
          const el = document.createElement('button');
          el.textContent = item.num;
          el.className = 'label-3d w-6 h-6 rounded-full bg-white/95 text-slate-800 border border-slate-300 shadow text-[11px] font-bold flex items-center justify-center z-10';
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            selectItem(item.id);
          });
          labelsLayer.appendChild(el);
          labelElements3D[item.id] = el;
        }
      });

      // Raycaster pour cliquer directement sur les meubles 3D
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const dom = renderer.domElement;

      dom.addEventListener('pointerdown', (e) => {
        orbit.moved = false;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;
        if (e.button === 2 || e.shiftKey) {
          orbit.isPanning = true;
        } else {
          orbit.isDragging = true;
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!orbit.isDragging && !orbit.isPanning) return;
        const dx = e.clientX - orbit.prevX;
        const dy = e.clientY - orbit.prevY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) orbit.moved = true;
        orbit.prevX = e.clientX;
        orbit.prevY = e.clientY;

        if (orbit.isDragging) {
          orbit.theta -= dx * 0.007;
          orbit.phi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, orbit.phi - dy * 0.007));
        } else if (orbit.isPanning) {
          const panSpeed = 0.012;
          orbit.target.x -= dx * panSpeed;
          orbit.target.z -= dy * panSpeed;
        }
        updateCameraFromOrbit();
      });

      window.addEventListener('pointerup', (e) => {
        if (orbit.isDragging && !orbit.moved && currentView === '3d') {
          const rect = dom.getBoundingClientRect();
          if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(clickableObjects, false);
            if (hits.length > 0 && hits[0].object.userData.itemId) {
              selectItem(hits[0].object.userData.itemId);
            }
          }
        }
        orbit.isDragging = false;
        orbit.isPanning = false;
      });

      dom.addEventListener('contextmenu', e => e.preventDefault());

      dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        orbit.radius = Math.max(4, Math.min(22, orbit.radius + e.deltaY * 0.008));
        updateCameraFromOrbit();
      }, { passive: false });

      window.addEventListener('resize', resizeThree);

      // Boucle d'animation
      function animate() {
        requestAnimationFrame(animate);
        if (currentView !== '3d') return;
        renderer.render(scene, camera);
        update3DLabels();
      }
      animate();
      updateVisualStates();
    }

    function update3DLabels() {
      const container = document.getElementById('three-canvas-wrapper');
      const w = container.clientWidth;
      const h = container.clientHeight;
      const vec = new THREE.Vector3();

      ITEMS.forEach(item => {
        if (item.num === null) return;
        const el = labelElements3D[item.id];
        if (!el) return;
        vec.set((item.x1 + item.x2) / 2, item.height + 0.25, (item.z1 + item.z2) / 2);
        vec.project(camera);

        if (vec.z > 1) {
          el.style.display = 'none';
        } else {
          el.style.display = 'flex';
          el.style.left = `${(vec.x * 0.5 + 0.5) * w}px`;
          el.style.top = `${(-vec.y * 0.5 + 0.5) * h}px`;
        }
      });
    }

    function resizeThree() {
      if (!threeInitialized) return;
      const container = document.getElementById('three-canvas-wrapper');
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // =========================================================================
    // 6. BASCULEMENT 2D / 3D & INITIALISATION
    // =========================================================================
    const btn2d = document.getElementById('btn-view-2d');
    const btn3d = document.getElementById('btn-view-3d');
    const container2d = document.getElementById('view-2d-container');
    const container3d = document.getElementById('view-3d-container');

    function switchView(mode) {
      currentView = mode;
      if (mode === '2d') {
        container2d.classList.remove('hidden');
        container3d.classList.add('hidden');
        btn2d.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all bg-white text-slate-900 shadow-sm flex items-center gap-1.5';
        btn3d.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
      } else {
        container2d.classList.add('hidden');
        container3d.classList.remove('hidden');
        btn3d.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all bg-white text-slate-900 shadow-sm flex items-center gap-1.5';
        btn2d.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
        initThree();
        setTimeout(resizeThree, 20);
      }
    }

    btn2d.addEventListener('click', () => switchView('2d'));
    btn3d.addEventListener('click', () => switchView('3d'));

    document.getElementById('cam-iso').addEventListener('click', () => setCameraPreset('iso'));
    document.getElementById('cam-top').addEventListener('click', () => setCameraPreset('top'));
    document.getElementById('cam-reset').addEventListener('click', () => setCameraPreset('reset'));

    // Clic sur le fond du SVG pour désélectionner
    document.getElementById('bcd-svg').addEventListener('click', () => selectItem(null));

    window.onload = () => {
      render2D();
      renderSidebar();
    };
  </script>
</body>
</html>
